<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Days 2026 | Luisdavid Colina</title>
<meta name="description" content="Destruyendo el vibe coding. Ponencia de Luisdavid Colina en Dev Days 2026, Auditorio Manuel Bemporad, Escuela de Computación, Facultad de Ciencias, UCV. Viernes 2 de octubre de 2026.">
<meta name="author" content="Luisdavid Colina">

<!-- Favicon: la marca de GitHub, dibujada aqui mismo para no pedir archivos -->
<link rel="icon" href="assets/logos/github-mark.svg">

<!-- Tipografia: los archivos viajan dentro de la carpeta, en assets/fonts.
     No se le pide nada a internet, asi que la letra es la misma en el salon,
     en Linux y en cualquier maquina, con red o sin ella. -->
<link rel="stylesheet" href="assets/css/fuentes.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/motion.css">

<!-- Una hoja por bloque de laminas. Cada una solo trae lo que components.css
     no cubre, para que ningun bloque pise el estilo de otro. -->
<link rel="stylesheet" href="assets/css/laminas/00-identidad.css">
<link rel="stylesheet" href="assets/css/laminas/01-apertura.css">
<link rel="stylesheet" href="assets/css/laminas/01-portada.css">
<link rel="stylesheet" href="assets/css/laminas/02-golpe.css">
<link rel="stylesheet" href="assets/css/laminas/03-metodo.css">
<link rel="stylesheet" href="assets/css/laminas/04-agentes.css">
<link rel="stylesheet" href="assets/css/laminas/05-cierre.css">
</head>

<body>

<div id="deck"></div>

<!-- ── Barra de presentador ─────────────────────────────────────────────── -->
<div id="hud">
  <button data-act="prev" title="Anterior (flecha izquierda)" aria-label="Lamina anterior">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="counter"></span>
  <button data-act="next" title="Siguiente (flecha derecha o espacio)" aria-label="Lamina siguiente">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <span class="hud-sep"></span>
  <span id="timer" title="Clic para iniciar o reiniciar el cronometro (tecla R)">00:00</span>
  <span class="hud-sep"></span>

  <button data-act="index" title="Indice (tecla I)" aria-label="Ir al indice">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <button data-act="theme" title="Tema claro u oscuro (tecla T)" aria-label="Cambiar tema">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button data-act="full" title="Pantalla completa (tecla F)" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
  </button>
  <button data-act="print" title="Exportar a PDF" aria-label="Exportar a PDF">
    <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><path d="M6 18H4v-6h16v6h-2"/><path d="M6 14h12v7H6z"/></svg>
  </button>
  <button data-act="help" title="Atajos de teclado (tecla H)" aria-label="Ayuda">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.2 9a2.8 2.8 0 015.6.4c0 1.9-2.8 2.2-2.8 4"/><path d="M12 17.5h.01"/></svg>
  </button>
</div>

<!-- ── Pantalla negra, salto de lamina y ayuda ──────────────────────────
     Sin panel de notas del presentador: la teoria de cada lamina vive en
     guion/, impresa, y no dentro del HTML. -->
<div id="blackout"></div>
<div id="jump"></div>

<div id="help">
  <div class="card">
    <h3>Control de la presentacion</h3>
    <table>
      <tr><td><kbd>&rarr;</kbd> <kbd>espacio</kbd></td><td>Avanzar</td></tr>
      <tr><td><kbd>&larr;</kbd></td><td>Retroceder</td></tr>
      <tr><td><kbd>0</kbd> <kbd>7</kbd><span class="dim"> y esperar</span></td><td>Saltar a esa lamina</td></tr>
      <tr><td><kbd>B</kbd></td><td>Pantalla en negro (para hablar sin distraer)</td></tr>
      <tr><td><kbd>R</kbd></td><td>Iniciar o reiniciar el cronometro</td></tr>
      <tr><td><kbd>I</kbd></td><td>Volver al indice</td></tr>
      <tr><td><kbd>T</kbd></td><td>Tema claro u oscuro (si el proyector lava los negros)</td></tr>
      <tr><td><kbd>F</kbd></td><td>Pantalla completa</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Cerrar todo</td></tr>
    </table>
  </div>
</div>

<!-- ── Contenido ────────────────────────────────────────────────────────────
     Un archivo por bloque. Se agregan o se quitan <script> segun crezca la
     ponencia, y el orden de estas lineas es el orden de las laminas. -->
<script>window.DECK = [];</script>
<script src="assets/js/fondo-codigo.js"></script>
<script src="assets/js/slides/01-apertura.js"></script>
<script src="assets/js/slides/02-golpe.js"></script>
<script src="assets/js/slides/03-metodo.js"></script>
<script src="assets/js/slides/04-agentes.js"></script>
<script src="assets/js/slides/05-cierre.js"></script>
<script src="assets/js/deck.js"></script>

</body>
</html>
